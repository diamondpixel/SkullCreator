plugins {
    id 'java-library'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = "io.github.diamondpixel"
version = "3.2.1"

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    repositories {
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(8))
        }
    }

    group = rootProject.group
    version = rootProject.version

    if (name == "SkullCreatorAPI") {

        java {
            withSourcesJar()
            withJavadocJar()
        }

        publishing {
            publications {
                maven(MavenPublication) {
                    from components.java

                    artifactId = "skullcreator-api"

                    pom {
                        name = "SkullCreator"
                        description = "A library to create player skulls from usernames, UUIDs, base64, or URLs."
                        url = "https://github.com/diamondpixel/SkullCreator"

                        licenses {
                            license {
                                name = "MIT License"
                                url = "https://opensource.org/licenses/MIT"
                            }
                        }

                        developers {
                            developer {
                                id = "diamondpixel"
                                name = "DiamondPixel"
                            }
                        }

                        scm {
                            connection = "scm:git:https://github.com/diamondpixel/SkullCreator.git"
                            developerConnection = "scm:git:https://github.com/diamondpixel/SkullCreator.git"
                            url = "https://github.com/diamondpixel/SkullCreator"
                        }
                    }
                }
            }
        }

        // IMPORTANT: signing AFTER publication exists
        afterEvaluate {
            signing {
                sign(publishing.publications.maven)
            }
        }
    }
}

// Custom build directories (optional, safe)
project(":SkullCreatorAPI") {
    layout.buildDirectory = file("${rootDir}/build/API")
}

project(":SkullCreatorDemoPlugin") {
    layout.buildDirectory = file("${rootDir}/build/Demo")
}

// Sonatype Central (s01)
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri("https://s01.oss.sonatype.org/service/local/")
            snapshotRepositoryUrl = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
            username = System.getenv("SONATYPE_USER")
            password = System.getenv("SONATYPE_TOKEN")
        }
    }
}
